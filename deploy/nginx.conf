# Bancada IFSC — site estático puro (sem build, sem backend).
#
# ARQUITETURA: a Cloudflare fica na frente (proxy ligado, nuvem laranja).
#   visitante --443--> Cloudflare --443--> este servidor
#
# A operadora deste link (Directnet, AS28590) bloqueia a porta 80 de entrada.
# Por isso o servidor só é alcançável de fora pela 443, e quem atende o
# http:// dos visitantes é a Cloudflare, não este nginx.
#
# Consequência prática: nada de certbot/Let's Encrypt aqui. O desafio HTTP-01
# precisa da porta 80. Usamos um Origin Certificate da Cloudflare, válido por
# 15 anos e emitido a partir do CSR gerado neste servidor.
#
# No painel da Cloudflare, SSL/TLS precisa estar em "Full (strict)".
#
# Instalar:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bancada-ifsc
#   sudo ln -s /etc/nginx/sites-available/bancada-ifsc /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Sem isto, todo acesso aparece no log com IP da Cloudflare em vez do IP de
# quem realmente visitou. Lista oficial: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Só a Cloudflare (e a LAN) podem falar com a origem na 443. Sem isto, quem
# descobrir o IP 200.152.8.138 acessa o site por fora da Cloudflare, furando
# cache, rate limit e proteção. Para desligar, troque o "default 0" por "default 1".
#
# Repare no $realip_remote_addr: é o IP de quem ABRIU a conexão (a Cloudflare).
# Usar o padrão do geo, que é $remote_addr, não funcionaria — o real_ip_header
# logo abaixo reescreve $remote_addr para o IP do visitante final, e aí todo
# acesso legítimo vindo da Cloudflare levaria 403.
geo $realip_remote_addr $origem_permitida {
    default            0;
    192.168.88.0/24    1;   # rede local
    127.0.0.1/32       1;
    173.245.48.0/20    1;
    103.21.244.0/22    1;
    103.22.200.0/22    1;
    103.31.4.0/22      1;
    141.101.64.0/18    1;
    108.162.192.0/18   1;
    190.93.240.0/20    1;
    188.114.96.0/20    1;
    197.234.240.0/22   1;
    198.41.128.0/17    1;
    162.158.0.0/15     1;
    104.16.0.0/13      1;
    104.24.0.0/14      1;
    172.64.0.0/13      1;
    131.0.72.0/22      1;
    2400:cb00::/32     1;
    2606:4700::/32     1;
    2803:f800::/32     1;
    2405:b500::/32     1;
    2405:8100::/32     1;
    2a06:98c0::/29     1;
    2c0f:f248::/32     1;
}

server {
    # nginx 1.22 (Debian 12): http2 é sufixo do listen. A diretiva
    # "http2 on;" só existe a partir do nginx 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ifsc.sohan.sbs;

    # Origin Certificate da Cloudflare. A chave foi gerada neste servidor e
    # nunca saiu dele; a Cloudflare assinou só o CSR.
    ssl_certificate     /etc/nginx/cloudflare/origin.crt;
    ssl_certificate_key /etc/nginx/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    if ($origem_permitida = 0) { return 403; }

    root /var/www/bancada-ifsc;
    index index.html;

    # O app não tem rotas — as abas são trocadas em JS, sem mudar a URL.
    # Então nada de fallback para index.html: 404 de verdade em caminho errado.
    location / {
        try_files $uri $uri/ =404;
    }

    # index.html nunca em cache: é o que carrega as versões novas dos .js
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Os dados são ~130 KB de .js que mudam quando você adiciona questões.
    # Cache curto com revalidação: rápido, mas pega atualização no mesmo dia.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Os .md ficam servidos como texto, não como página.
    location ~* \.md$ {
        default_type text/plain; charset utf-8;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/markdown;

    # O único recurso externo é o Google Fonts (CSS em fonts.googleapis.com,
    # arquivos em fonts.gstatic.com). Se remover as fontes do index.html,
    # pode apertar a CSP para default-src 'self'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/bancada-ifsc.access.log;
    error_log  /var/log/nginx/bancada-ifsc.error.log;
}

# Acesso pela rede local, sem depender de DNS, da Cloudflare ou de TLS.
# A porta 80 deste servidor não é alcançável da internet (bloqueio da operadora),
# então este bloco serve só quem está dentro de casa: http://192.168.88.42:8800
server {
    listen 8800;
    listen [::]:8800;
    server_name _;

    root /var/www/bancada-ifsc;
    index index.html;

    location / { try_files $uri $uri/ =404; }
    location ~* \.md$ { default_type text/plain; charset utf-8; }

    gzip on;
    gzip_types text/plain text/css application/javascript;
}
